services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: /data/terminalshop.db
      API_PORT: "8080"
      APP_URL: https://api.sshops.uk
    volumes:
      - ./data:/data
    expose:
      - "8080"

  ssh:
    build:
      context: .
      dockerfile: Dockerfile.ssh
    restart: unless-stopped
    env_file: .env.prod
    environment:
      SSH_HOST: 0.0.0.0
      SSH_PORT: "22"
      API_URL: http://api:8080
    ports:
      # hostsshd owns :22; router forwards public 22 -> 2222
      - "2222:22"
    volumes:
      - ./.ssh:/root/.ssh
    depends_on:
      - api

    # Outbound tunnel to CloudFlare: serves api.sshops.uk with no inbound port,
    # TLS terminated at CloudFlare. Ingress (api.sshops.uk -> http://api:8080)
    # is configured in the Zero Trust dashboard; the token picks the tunnel.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    # Only TUNNEL_TOKEN; keeps app secrets out of this container.
    env_file: .env.tunnel
    depends_on:
      - api
